# parallax-scene v1 — Forest→city portal flythrough (SPEC §6.3, full-duration)
#
# Faithful to SPEC.md §6.3: same Z values, plate sizes, noise params,
# mask block. Resolution dropped from 1920×1080 to 960×540 because
# the encoder hangs at 1080p (handoff §3, §5.9).
#
# DEVIATION FROM §6.3: camera Bezier endpoint is [0,0,-5500], not [0,0,-4400].
# §6.3's worked-example endpoint stops 100 units BEFORE the portal_tree at
# z=-4500, so the near-cull handoff (projection.py:230 — fires when the layer
# is ≥ perspective_px-300 = 900 units BEHIND the camera) never triggers and
# the city never fully takes over the frame. Extending the path past z=-5400
# lets cull_opacity reach 0, the mask flips to M=1.0 everywhere (masks.py:330),
# and the destination stack takes the full frame for the final ~0.5s — the
# "passing through" moment from §2.4 / portal_mechanic.md insight 2.
version: 1
meta:
  duration_s: 8.0
  fps: 30
  resolution: [960, 540]
  perspective_px: 1200
  origin: [480, 270]
  bg_color: "#000000"
  seed: 1

stacks:
  forest:
    layers:
      - { id: sky,         src: assets/sky.svg,         scene_xyz: [0,0,-10500], plate_size: [3840,2160] }
      - { id: trees_far,   src: assets/trees_far.svg,   scene_xyz: [0,0,-8500],  plate_size: [3840,2160] }
      - { id: trees_mid,   src: assets/trees_mid.svg,   scene_xyz: [0,0,-6500],  plate_size: [3840,2160] }
      - { id: portal_tree, src: assets/portal_tree.svg, scene_xyz: [0,0,-4500],  plate_size: [3840,2160], svg_paint_id: silhouette }
      - { id: leaves_mid,  src: assets/leaves_mid.svg,  scene_xyz: [0,0,-2500],  plate_size: [3840,2160] }
      - { id: leaves_fg,   src: assets/leaves_fg.svg,   scene_xyz: [0,0,-500],   plate_size: [3840,2160] }
  city:
    layers:
      - { id: city_sky,  src: assets/city_sky.svg,  scene_xyz: [0,0,-10500], plate_size: [3840,2160] }
      - { id: city_far,  src: assets/city_far.svg,  scene_xyz: [0,0,-7000],  plate_size: [3840,2160] }
      - { id: city_near, src: assets/city_near.svg, scene_xyz: [0,0,-3500],  plate_size: [3840,2160] }

camera:
  mode: drone
  drone:
    path:
      kind: bezier
      controls: [[0,0,0],[40,10,-2000],[-30,-10,-3800],[0,0,-5500]]
      duration_s: 8.0
    poi_lookahead_s: 0.5
    spring_halflife_s: 0.20
    noise: { z_amp: 18, xy_amp: 5, hz: 0.6 }
    bank_from_velocity: 0.30

masks:
  - id: portal
    path_svg: assets/portal_tree.svg
    silhouette_id_in_svg: silhouette
    path_id_in_svg: hole
    attached_to_layer: forest.portal_tree
    anchor: world
    src_stack: forest
    dest_stack: city
    matte: alpha
    growth: { kind: perspective }

post:
  global:
    vignette: { strength: 0.45 }
    grain:    { sigma: 3 }
    fisheye:  { k1: 0.18 }
