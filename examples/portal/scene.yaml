# parallax-scene v1 — Forest→city portal flythrough (SPEC §6.3, full-duration)
#
# Faithful to SPEC.md §6.3: same Z values, plate sizes, noise params,
# mask block. Resolution dropped from 1920×1080 to 960×540 because
# the encoder hangs at 1080p (handoff §3, §5.9).
#
# DEVIATION FROM §6.3: camera Bezier endpoint is [0,0,-10000], not [0,0,-4400].
# §6.3's worked-example endpoint stops 100 units BEFORE the portal_tree at
# z=-4500, so the near-cull handoff (projection.py:230 — fires when the layer
# is ≥ perspective_px-300 = 900 units BEHIND the camera) never triggers.
#
# This demo extends the path so the camera (a) passes the portal at t=4s
# (mid-clip), letting the near-cull dissolve fire and the city stack take
# the full frame, and (b) continues forward through the city stack for
# the second half — flying past city_far (z=-7000) around t=6.5s and ending
# near city_sky (z=-10500). The result is a complete "drone flies into
# portal, emerges into the destination world, continues onward" beat,
# rather than the spec's clipped "approach the portal" framing.
version: 1
meta:
  duration_s: 8.0
  fps: 30
  resolution: [960, 540]
  perspective_px: 1200
  origin: [480, 270]
  bg_color: "#000000"
  seed: 1

stacks:
  forest:
    layers:
      - { id: sky,         src: assets/sky.svg,         scene_xyz: [0,0,-10500], plate_size: [3840,2160] }
      - { id: trees_far,   src: assets/trees_far.svg,   scene_xyz: [0,0,-8500],  plate_size: [3840,2160] }
      - { id: trees_mid,   src: assets/trees_mid.svg,   scene_xyz: [0,0,-6500],  plate_size: [3840,2160] }
      - { id: portal_tree, src: assets/portal_tree.svg, scene_xyz: [0,0,-4500],  plate_size: [3840,2160], svg_paint_id: silhouette }
      - { id: leaves_mid,  src: assets/leaves_mid.svg,  scene_xyz: [0,0,-2500],  plate_size: [3840,2160] }
      - { id: leaves_fg,   src: assets/leaves_fg.svg,   scene_xyz: [0,0,-500],   plate_size: [3840,2160] }
  city:
    layers:
      - { id: city_sky,  src: assets/city_sky.svg,  scene_xyz: [0,0,-10500], plate_size: [3840,2160] }
      - { id: city_far,  src: assets/city_far.svg,  scene_xyz: [0,0,-7000],  plate_size: [3840,2160] }
      - { id: city_near, src: assets/city_near.svg, scene_xyz: [0,0,-3500],  plate_size: [3840,2160] }

camera:
  mode: drone
  drone:
    path:
      kind: bezier
      # Camera path designed for "fly through the portal" arc:
      #   t=0..4s — approach forest, portal hole grows in center frame
      #   t=4s   — pass through portal_tree (z=-4500); near-cull fires;
      #             mask flips to M=1.0 → city stack takes the frame
      #             (engineered: B(0.5).z = -5400 so portal z_cam = +900 = cull_end)
      #   t=4..8s — continue forward through the city stack:
      #             flies past city_far (z=-7000) around t=6.5s,
      #             ending near city_sky (z=-10500) at z=-10000.
      # Lateral motion: P1 banks right (x=200) for the approach, P2 returns
      # near-center (x=-50) so the second-half flight feels like a steady
      # forward dolly through the city, not a swerve.
      controls: [[0,0,0],[200,40,-4400],[-50,-10,-6667],[0,0,-10000]]
      duration_s: 8.0
    poi_lookahead_s: 0.5
    spring_halflife_s: 0.20
    noise: { z_amp: 22, xy_amp: 8, hz: 0.7 }
    bank_from_velocity: 0.40

masks:
  - id: portal
    path_svg: assets/portal_tree.svg
    silhouette_id_in_svg: silhouette
    path_id_in_svg: hole
    attached_to_layer: forest.portal_tree
    anchor: world
    src_stack: forest
    dest_stack: city
    matte: alpha
    growth: { kind: perspective }

post:
  global:
    vignette: { strength: 0.45 }
    grain:    { sigma: 3 }
    fisheye:  { k1: 0.18 }
