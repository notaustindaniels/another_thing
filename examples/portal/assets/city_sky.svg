<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a1850"/>
      <stop offset="35%" stop-color="#c03860"/>
      <stop offset="62%" stop-color="#f07028"/>
      <stop offset="80%" stop-color="#ffc870"/>
      <stop offset="100%" stop-color="#fff0d0"/>
    </linearGradient>
    <radialGradient id="sunHalo4" cx="0.417" cy="0.648" r="0.22" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#fff8d0" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#fff0c0" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#f8d890" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f8d890" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sunCore" cx="0.417" cy="0.648" r="0.04" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#fffef0"/>
      <stop offset="50%" stop-color="#fff8d0"/>
      <stop offset="100%" stop-color="#ffd870"/>
    </radialGradient>
    <radialGradient id="celestialBody" cx="0.755" cy="0.185" r="0.03" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#e0b0b0"/>
      <stop offset="60%" stop-color="#c08080"/>
      <stop offset="100%" stop-color="#c08080" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rayGrad1" x1="0" y1="1" x2="0.3" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#ffd870" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffd870" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rayGrad2" x1="0" y1="1" x2="0.15" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#ffcc60" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffcc60" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rayGrad3" x1="0" y1="1" x2="-0.15" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#ffd060" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#ffd060" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rayGrad4" x1="0" y1="1" x2="-0.3" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#ffe080" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffe080" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rayGrad5" x1="0" y1="1" x2="0.45" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#ffc850" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#ffc850" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rayGrad6" x1="0" y1="1" x2="-0.5" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#ffc850" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#ffc850" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rayGrad7" x1="0" y1="1" x2="0.65" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#ffd070" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffd070" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Full sky gradient base -->
  <rect x="0" y="0" width="3840" height="2160" fill="url(#skyGrad)"/>

  <!-- Large sun halo glow -->
  <rect x="0" y="0" width="3840" height="2160" fill="url(#sunHalo4)"/>

  <!-- Light ray 1 - leftward wide -->
  <polygon points="1600,1400 820,0 1020,0" fill="url(#rayGrad4)" opacity="1"/>

  <!-- Light ray 2 - slightly left -->
  <polygon points="1600,1400 1100,0 1230,0" fill="url(#rayGrad3)" opacity="1"/>

  <!-- Light ray 3 - near center left -->
  <polygon points="1600,1400 1380,0 1480,0" fill="url(#rayGrad2)" opacity="1"/>

  <!-- Light ray 4 - near center right -->
  <polygon points="1600,1400 1700,0 1820,0" fill="url(#rayGrad1)" opacity="1"/>

  <!-- Light ray 5 - right -->
  <polygon points="1600,1400 1980,0 2130,0" fill="url(#rayGrad5)" opacity="1"/>

  <!-- Light ray 6 - far right -->
  <polygon points="1600,1400 2350,0 2530,0" fill="url(#rayGrad6)" opacity="1"/>

  <!-- Light ray 7 - far left -->
  <polygon points="1600,1400 380,0 580,0" fill="url(#rayGrad7)" opacity="1"/>

  <!-- Cloud band 1 - large fiery orange low band -->
  <path d="M 0,1520 C 200,1490 450,1470 700,1480 C 950,1490 1050,1540 1300,1530 C 1550,1520 1700,1490 1950,1505 C 2200,1520 2350,1555 2600,1540 C 2850,1525 3050,1495 3300,1510 C 3550,1525 3700,1545 3840,1530 L 3840,1600 C 3700,1620 3550,1605 3300,1590 C 3050,1575 2850,1600 2600,1610 C 2350,1620 2200,1600 1950,1585 C 1700,1570 1550,1580 1300,1590 C 1050,1600 950,1580 700,1570 C 450,1560 200,1575 0,1600 Z" fill="#ee9050" opacity="0.55"/>

  <!-- Cloud band 2 - warm pink mid-low -->
  <path d="M 0,1280 C 300,1250 600,1230 900,1245 C 1150,1258 1280,1295 1520,1285 C 1760,1275 1900,1245 2150,1260 C 2400,1275 2530,1310 2780,1295 C 3030,1280 3200,1250 3450,1265 C 3650,1277 3760,1295 3840,1290 L 3840,1355 C 3760,1360 3650,1345 3450,1335 C 3200,1322 3030,1350 2780,1362 C 2530,1374 2400,1345 2150,1330 C 1900,1315 1760,1340 1520,1350 C 1280,1360 1150,1330 900,1318 C 600,1305 300,1320 0,1345 Z" fill="#e09080" opacity="0.45"/>

  <!-- Cloud band 3 - magenta violet upper -->
  <path d="M 0,800 C 250,770 550,755 850,768 C 1100,780 1250,820 1500,808 C 1750,796 1920,760 2200,775 C 2480,790 2620,828 2880,815 C 3140,802 3300,768 3560,782 C 3720,792 3800,808 3840,812 L 3840,870 C 3800,875 3720,862 3560,850 C 3300,835 3140,865 2880,878 C 2620,891 2480,858 2200,843 C 1920,828 1750,860 1500,872 C 1250,884 1100,852 850,840 C 550,826 250,840 0,862 Z" fill="#8050a0" opacity="0.38"/>

  <!-- Cloud band 4 - orange-gold elongated lenticular -->
  <path d="M 200,1100 C 450,1075 700,1060 1000,1065 C 1250,1070 1420,1095 1700,1088 C 1980,1081 2150,1055 2450,1065 C 2750,1075 2920,1105 3200,1095 C 3450,1086 3650,1065 3840,1072 L 3840,1128 C 3650,1135 3450,1155 3200,1148 C 2920,1140 2750,1115 2450,1122 C 2150,1129 1980,1150 1700,1142 C 1420,1134 1250,1122 1000,1120 C 700,1118 450,1130 200,1148 Z" fill="#ee9050" opacity="0.32"/>

  <!-- Cloud band 5 - pink-violet high -->
  <path d="M 0,480 C 350,460 680,448 1020,458 C 1320,467 1500,495 1800,484 C 2100,473 2280,445 2580,455 C 2880,465 3050,492 3320,480 C 3560,469 3720,450 3840,455 L 3840,508 C 3720,504 3560,520 3320,530 C 3050,540 2880,516 2580,507 C 2280,498 2100,524 1800,535 C 1500,546 1320,520 1020,511 C 680,501 350,512 0,528 Z" fill="#c05080" opacity="0.30"/>

  <!-- Cloud band 6 - warm magenta lenticular mid -->
  <path d="M 0,1640 C 300,1618 620,1605 950,1615 C 1220,1623 1420,1650 1720,1640 C 2020,1630 2200,1608 2500,1618 C 2800,1628 2980,1655 3280,1644 C 3530,1634 3720,1615 3840,1620 L 3840,1672 C 3720,1668 3530,1684 3280,1694 C 2980,1705 2800,1680 2500,1670 C 2200,1660 2020,1680 1720,1690 C 1420,1700 1220,1675 950,1667 C 620,1658 300,1668 0,1685 Z" fill="#e09080" opacity="0.28"/>

  <!-- Cloud band 7 - deep violet near top -->
  <path d="M 0,180 C 400,162 800,152 1200,160 C 1550,167 1750,188 2100,178 C 2450,168 2700,145 3050,155 C 3350,164 3600,180 3840,175 L 3840,228 C 3600,233 3350,218 3050,208 C 2700,198 2450,220 2100,230 C 1750,240 1550,222 1200,215 C 800,207 400,218 0,235 Z" fill="#6030a0" opacity="0.28"/>

  <!-- Sun core disc -->
  <circle cx="1600" cy="1400" r="95" fill="url(#sunCore)"/>

  <!-- Sun inner bright ring -->
  <circle cx="1600" cy="1400" r="95" fill="#fffef0" opacity="0.9"/>

  <!-- Sun halo ring 1 -->
  <ellipse cx="1600" cy="1400" rx="180" ry="165" fill="#fff0c0" opacity="0.45"/>

  <!-- Sun halo ring 2 -->
  <ellipse cx="1600" cy="1400" rx="310" ry="280" fill="#ffe8a0" opacity="0.25"/>

  <!-- Sun halo ring 3 -->
  <ellipse cx="1600" cy="1400" rx="490" ry="420" fill="#f8d890" opacity="0.16"/>

  <!-- Sun halo ring 4 -->
  <ellipse cx="1600" cy="1400" rx="740" ry="600" fill="#f8c870" opacity="0.10"/>

  <!-- Sun halo ring 5 large diffuse -->
  <ellipse cx="1600" cy="1400" rx="1100" ry="820" fill="#ffc860" opacity="0.06"/>

  <!-- Secondary celestial body - dusty rose moon/planet -->
  <circle cx="2900" cy="400" r="52" fill="#d09090" opacity="0.75"/>
  <circle cx="2900" cy="400" r="52" fill="url(#celestialBody)" opacity="0.6"/>
  <!-- Crescent shadow on moon -->
  <path d="M 2900,348 C 2935,358 2952,380 2952,400 C 2952,420 2935,442 2900,452 C 2920,440 2932,420 2932,400 C 2932,380 2920,360 2900,348 Z" fill="#7a4040" opacity="0.35"/>

  <!-- Horizon glow blend strip -->
  <rect x="0" y="1480" width="3840" height="120" fill="#ffc870" opacity="0.20"/>
  <rect x="0" y="1540" width="3840" height="80" fill="#fff0d0" opacity="0.18"/>

  <!-- Upper atmosphere color deepening overlay -->
  <rect x="0" y="0" width="3840" height="300" fill="#3a1850" opacity="0.22"/>
</svg>