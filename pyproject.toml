[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "parallax-engine"
version = "0.1.0"
description = "2.5D multiplane camera animation engine: renderer + director tier + orchestration"
readme = "README.md"
license = { text = "Proprietary" }
requires-python = ">=3.11"
dependencies = [
    # Core rendering stack — all permissive licenses (BSD/MIT/HPND/Apache)
    "Pillow>=10.0",           # HPND (MIT-style) — PIL: PNG I/O, layer compositing (render.py, tests)
    "numpy>=1.26",            # BSD — projection, composite, camera, encode, masks math
    "opencv-python-headless>=4.8",  # Apache 2.0 — cv2: resize, remap, Lanczos, mask ops (render.py, masks.py, tools/qa.py, tools/autosegment.py)
    # Schema and config
    "pydantic>=2.0",          # MIT — Pydantic v2 models (scene.py, director/schema.py, director/prompt.py, casting/bible.py)
    "pyyaml>=6.0",            # MIT — yaml: scene.yaml + storyboard.yaml parsing (scene.py, director/schema.py, director/agent.py, casting/bible.py, synthetic_renderer.py)
    # Agent harness (MIT — Anthropic SDK)
    "claude-code-sdk>=0.0.25",  # claude_code_sdk: ClaudeSDKClient/ClaudeCodeOptions/HookMatcher (lead.py, runner/client.py, runner/agent.py)
]

[project.optional-dependencies]
# Optional skia-python rasterizer. render.py imports skia inside try/except and
# falls back to the rsvg-convert CLI (§5.3) when unavailable, so installs that
# already have rsvg-convert can skip skia-python's native build.
render = [
    "skia-python>=87.0",      # BSD — SVG rasterization via skia (parallax_engine/render.py, optional fallback)
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
    "mypy>=1.0",
]

[project.scripts]
parallax-engine = "parallax_engine.cli:main"

[tool.setuptools.packages.find]
include = ["parallax_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
